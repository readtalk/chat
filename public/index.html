<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<title>READTalk Messenger</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="stylesheet" href="css/normalize.css" />
		<link rel="stylesheet" href="css/backbone.css" />

		<link rel="icon" type="image/ico" href="favicon.ico" />
		<script src="/dist/index.js" type="module"></script>

		<style>
			/* ===== FULL INLINE STYLE UNTUK MESSENGER MODERN ===== */
			/* Berdasarkan class dari normalize.css + backbone.css */

			/* Reset & Dasar */
			html, body {
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
			}

			/* #root sebagai container utama chat (akan menggantikan .main) */
			#root {
				height: 100%;
				display: flex;
				flex-direction: column;
				background: #f0f2f5;
			}

			/* Area daftar pesan (scroll) */
			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 16px 20px;
				display: flex;
				flex-direction: column;
				gap: 6px;
				background: #f0f2f5;
			}

			/* Bubble pesan (dari backbone) */
			.message {
				max-width: 70%;
				padding: 8px 14px;
				border-radius: 12px;
				font-size: 1.4rem;
				line-height: 1.5;
				background: #ffffff;
				color: #111b21;
				align-self: flex-start;
				border-bottom-left-radius: 4px;
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
				word-wrap: break-word;
			}

			/* Pesan sendiri (dari backbone) */
			.message.self {
				align-self: flex-end;
				background: #ff0000;
				color: #ffffff;
				border-bottom-right-radius: 4px;
				border-bottom-left-radius: 12px;
			}

			/* Nama pengirim (dari backbone) */
			.message .sender {
				display: block;
				font-size: 1.1rem;
				font-weight: 600;
				color: #ff0000;
				margin-bottom: 2px;
			}

			.message.self .sender {
				display: none;
			}

			/* Form input chat (dari backbone) */
			.chat-input {
				display: flex;
				gap: 10px;
				padding: 12px 20px;
				background: #ffffff;
				border-top: 1px solid #e0e0e0;
				flex-shrink: 0;
				align-items: center;
			}

			/* Input teks */
			.chat-input input {
				flex: 1;
				padding: 12px 18px;
				border-radius: 25px;
				border: 1px solid #e0e0e0;
				background: #f0f2f5;
				color: #111b21;
				font-size: 1.4rem;
				outline: none;
			}

			.chat-input input:focus {
				border-color: #ff0000;
			}

			.chat-input input::placeholder {
				color: #667781;
			}

			/* Tombol kirim */
			.chat-input button {
				padding: 10px 24px;
				border-radius: 25px;
				border: none;
				background: #ff0000;
				color: #ffffff;
				font-weight: 600;
				font-size: 1.3rem;
				cursor: pointer;
				transition: background 0.2s;
				white-space: nowrap;
			}

			.chat-input button:hover {
				background: #e60000;
			}

			/* ===== TEMA GELAP ===== */
			[data-theme="dark"] #root {
				background: #0b141a;
			}

			[data-theme="dark"] .chat-messages {
				background: #0b141a;
			}

			[data-theme="dark"] .message {
				background: #1f2c38;
				color: #e9edef;
			}

			[data-theme="dark"] .message.self {
				background: #ff0000;
				color: #ffffff;
			}

			[data-theme="dark"] .message .sender {
				color: #ff6666;
			}

			[data-theme="dark"] .chat-input {
				background: #111b21;
				border-top-color: #2a3942;
			}

			[data-theme="dark"] .chat-input input {
				background: #2a3942;
				color: #e9edef;
				border-color: #2a3942;
			}

			[data-theme="dark"] .chat-input input::placeholder {
				color: #8696a0;
			}

			[data-theme="dark"] .chat-input button {
				background: #ff0000;
				color: #ffffff;
			}

			[data-theme="dark"] .chat-input button:hover {
				background: #cc0000;
			}
		</style>
	</head>

	<body>
		<!-- Struktur dari backbone.css -->
		<div class="app" style="height:100%;">
			<!-- Sidebar kiri (dari backbone) -->
			<div class="sidebar">
				<h4 class="sidebar-brand"><b>READT</b>alk Messenger</h4>
				<p></p>
				<button id="themeToggle" class="btn" style="margin-top:5px;">
					🌙 Dark
				</button>
			</div>

			<!-- Area chat utama (React akan merender di sini) -->
			<div class="main" id="root"></div>
		</div>

		<!-- Script tema (toggle dark/light) -->
		<script>
			const root = document.documentElement
			const savedTheme = localStorage.getItem("theme") || "light"
			root.dataset.theme = savedTheme

			const btn = document.getElementById("themeToggle")
			if (btn) {
				btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark"
				btn.onclick = () => {
					const next = root.dataset.theme === "dark" ? "light" : "dark"
					root.dataset.theme = next
					localStorage.setItem("theme", next)
					btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark"
				}
			}
		</script>
	</body>
</html>
