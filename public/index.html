<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <title>READTalk Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/skeleton.css" />
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <script src="/dist/index.js" type="module"></script>
    <style>
        @media (max-width: 550px) {
            .one-third.column {
                position: fixed !important;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 40px 20px !important;
                background: var(--bg);
                z-index: 1000;
                display: flex !important;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            .two-thirds.column {
                width: 100% !important;
                margin-left: 0 !important;
                padding: 0 !important;
            }
            .container {
                width: 100% !important;
                padding: 0 !important;
            }
            #root {
                padding: 0 10px;
            }
        }
        @media (min-width: 551px) {
            .one-third.column {
                position: relative !important;
                width: 30.6666666667% !important;
                margin-top: 25% !important;
                display: block !important;
            }
            .two-thirds.column {
                width: 65.3333333333% !important;
            }
        }
    </style>
</head>
<body>
    <!-- ===== MODAL POPUP YOUR NAME ===== -->
    <div id="nameModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2>Your Name</h2>
            <p>This will be your display name in chat</p>
            <input type="text" id="nameInput" placeholder="Enter your name..." />
            <button class="btn-primary" id="submitNameBtn">Start Chat →</button>
        </div>
    </div>

    <!-- ===== MAIN LAYOUT ===== -->
    <div class="container" style="width:95%; height:100%">
        <div class="row" style="height:100%">
            <div class="one-third column" style="margin-top:25%">
                <h4><b>READT</b>alk Messenger</h4>
                <p>by SOEPARNO Technology</p>
                <button id="themeToggle" class="button" style="margin-top:20px">🌙 Dark</button>
            </div>
            <div class="two-thirds column" id="root"></div>
        </div>
    </div>

    <script>
        // ===== THEME TOGGLE =====
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("theme") || "light";
        root.dataset.theme = savedTheme;

        const btn = document.getElementById("themeToggle");
        if (btn) {
            btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";
            btn.onclick = () => {
                const next = root.dataset.theme === "dark" ? "light" : "dark";
                root.dataset.theme = next;
                localStorage.setItem("theme", next);
                btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
            };
        }

        // ===== MODAL YOUR NAME =====
        (function() {
            const modal = document.getElementById('nameModal');
            const input = document.getElementById('nameInput');
            const submitBtn = document.getElementById('submitNameBtn');

            const savedName = localStorage.getItem('displayName');
            if (!savedName) {
                modal.style.display = 'flex';
                input.focus();
            }

            function saveName() {
                const name = input.value.trim();
                if (name) {
                    localStorage.setItem('displayName', name);
                    modal.style.display = 'none';
                    window.dispatchEvent(new CustomEvent('nameSet', { detail: { name } }));
                } else {
                    input.style.borderColor = '#FF0000';
                    setTimeout(() => { input.style.borderColor = ''; }, 1000);
                }
            }

            submitBtn.addEventListener('click', saveName);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveName();
            });
        })();
    </script>
</body>
</html>
