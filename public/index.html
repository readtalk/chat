<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <title>READTalk Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/skeleton.css" />
    <link rel="stylesheet" href="global.css" />

    <!-- ===== PHOSPHOR ICONS (CDN) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />

    <link rel="icon" type="image/ico" href="favicon.ico" />
    <script src="/dist/index.js" type="module"></script>

    <!-- ===== INLINE STYLE (Viewport + Mobile) ===== -->
    <style>
        /* Mobile: sidebar fullscreen */
        @media (max-width: 550px) {
            .one-third.column {
                position: fixed !important;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 40px 20px !important;
                background: var(--sidebar-bg, #f5f5f0);
                z-index: 1000;
                display: flex !important;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }
            .two-thirds.column {
                width: 100% !important;
                margin-left: 0 !important;
                padding: 0 !important;
            }
            .container {
                width: 100% !important;
                padding: 0 !important;
            }
            #root {
                padding: 0 10px;
                margin-top: 50px;
            }
        }

        /* Desktop: sidebar kiri, chat kanan */
        @media (min-width: 551px) {
            .one-third.column {
                position: relative !important;
                width: 30.6666666667% !important;
                margin-top: 25% !important;
                display: block !important;
            }
            .two-thirds.column {
                width: 65.3333333333% !important;
            }
        }
    </style>
</head>
<body>
    <!-- ===== MAIN LAYOUT ===== -->
    <div class="container" style="width:95%; height:100%">
        <div class="row" style="height:100%">

            <!-- ===== SIDEBAR (KIRI) ===== -->
            <div class="one-third column" id="sidebar" style="margin-top:25%">
                <!-- Header Sidebar -->
                <div class="sidebar-header">
                    <h4><b>READT</b>alk</h4>
                    <div class="sidebar-actions">
                        <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                            <i class="ph ph-moon"></i>
                        </button>
                        <button class="icon-btn" id="menuToggle" title="Menu">
                            <i class="ph ph-dots-three-vertical"></i>
                        </button>
                    </div>
                </div>

                <!-- Profile Card -->
                <div class="profile-card" id="profileCard">
                    <div class="avatar">A</div>
                    <div class="profile-info">
                        <span class="profile-name">Your Name</span>
                        <span class="profile-status">Online</span>
                    </div>
                    <button class="icon-btn" id="editProfile">
                        <i class="ph ph-pencil"></i>
                    </button>
                </div>

                <!-- Chat List (Placeholder) -->
                <div class="chat-list">
                    <div class="chat-item active">
                        <div class="chat-avatar">A</div>
                        <div class="chat-info">
                            <span class="chat-name">Angga</span>
                            <span class="chat-preview">Halo juga!</span>
                        </div>
                        <span class="chat-time">10:01</span>
                    </div>
                    <div class="chat-item">
                        <div class="chat-avatar">B</div>
                        <div class="chat-info">
                            <span class="chat-name">Budi</span>
                            <span class="chat-preview">Ok, nanti kita bahas</span>
                        </div>
                        <span class="chat-time">09:30</span>
                    </div>
                </div>
            </div>

            <!-- ===== CHAT AREA (KANAN) ===== -->
            <div class="two-thirds column" id="root">
                <!-- Akan diisi oleh React (index.tsx) -->
            </div>

        </div>
    </div>

    <script>
        // ===== THEME TOGGLE =====
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("theme") || "light";
        root.dataset.theme = savedTheme;

        const themeBtn = document.getElementById("themeToggle");
        if (themeBtn) {
            const icon = themeBtn.querySelector('i');
            icon.className = savedTheme === "dark" ? "ph ph-sun" : "ph ph-moon";
            themeBtn.onclick = () => {
                const next = root.dataset.theme === "dark" ? "light" : "dark";
                root.dataset.theme = next;
                localStorage.setItem("theme", next);
                icon.className = next === "dark" ? "ph ph-sun" : "ph ph-moon";
            };
        }

        // ===== MENU TOGGLE =====
        document.getElementById("menuToggle")?.addEventListener("click", () => {
            alert("Menu: Settings, Profile, Theme, Logout");
        });

        // ===== EDIT PROFILE =====
        document.getElementById("editProfile")?.addEventListener("click", () => {
            alert("Edit profile: change name, avatar, status");
        });
    </script>
</body>
</html>
