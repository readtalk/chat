<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<title>READTalk Messenger</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="stylesheet" href="css/normalize.css" />
		<link rel="stylesheet" href="css/backbone.css" />

		<link rel="icon" type="image/ico" href="favicon.ico" />
		<script src="/dist/index.js" type="module"></script>

		<style>
			/* Inline style untuk yang backbone tidak atur */
			html, body {
				height: 100%;
				margin: 0;
				padding: 0;
			}

			#root {
				height: 100%;
				display: flex;
				flex-direction: column;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
			}

			.chat-input {
				flex-shrink: 0;
			}
		</style>
	</head>

	<body>
		<div class="app" style="height:100%;">
			<div class="sidebar">
				<h4 class="sidebar-brand"><b>READT</b>alk Messenger</h4>
				<p></p>
				<button id="themeToggle" class="btn" style="margin-top:5px;">
					🌙 Dark
				</button>
			</div>
			<div class="main" id="root"></div>
		</div>

		<script>
			const root = document.documentElement
			const savedTheme = localStorage.getItem("theme") || "light"
			root.dataset.theme = savedTheme

			const btn = document.getElementById("themeToggle")
			if (btn) {
				btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark"
				btn.onclick = () => {
					const next = root.dataset.theme === "dark" ? "light" : "dark"
					root.dataset.theme = next
					localStorage.setItem("theme", next)
					btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark"
				}
			}
		</script>
	</body>
</html>
