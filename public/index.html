<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <title>READTalk Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/skeleton.css" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <script src="/dist/index.js" type="module"></script>
    <style>
        @media (max-width: 550px) {
            .one-third.column {
                position: fixed !important;
                top: 0;
                left: 0;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: var(--bg);
                z-index: 1000;
                overflow-y: auto;
            }
            .two-thirds.column {
                width: 100% !important;
                margin-left: 0 !important;
                padding: 0 !important;
            }
            .container {
                width: 100% !important;
                padding: 0 !important;
            }
            #root {
                padding: 0;
                margin-top: 0;
            }
        }
        @media (min-width: 551px) {
            .one-third.column {
                position: relative !important;
                width: 30.6666666667% !important;
                margin-top: 0 !important;
                height: 100vh !important;
                overflow-y: auto;
                display: block !important;
            }
            .two-thirds.column {
                width: 65.3333333333% !important;
            }
        }
    </style>
</head>
<body>
    <div class="container" style="width:95%; height:100%">
        <div class="row" style="height:100%">
            <div class="one-third column">
                <div class="sidebar-header">
                    <h5>READTalk</h5>
                    <div class="sidebar-actions">
                        <button class="icon-btn" id="themeToggle"><i class="ph ph-moon"></i></button>
                        <button class="icon-btn" id="menuToggle"><i class="ph ph-dots-three-vertical"></i></button>
                    </div>
                </div>
                <div class="profile-card">
                    <div class="avatar" id="profileAvatar">A</div>
                    <div class="profile-info">
                        <span class="profile-name" id="profileName">Your Name</span>
                        <span class="profile-status">Online</span>
                    </div>
                    <button class="icon-btn" id="editProfile"><i class="ph ph-pencil"></i></button>
                </div>
                <div class="chat-list" id="chatList"></div>
            </div>
            <div class="two-thirds column" id="root"></div>
        </div>
    </div>
    <script>
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("theme") || "light";
        root.dataset.theme = savedTheme;
        const themeBtn = document.getElementById("themeToggle");
        if (themeBtn) {
            const icon = themeBtn.querySelector('i');
            icon.className = savedTheme === "dark" ? "ph ph-sun" : "ph ph-moon";
            themeBtn.onclick = () => {
                const next = root.dataset.theme === "dark" ? "light" : "dark";
                root.dataset.theme = next;
                localStorage.setItem("theme", next);
                icon.className = next === "dark" ? "ph ph-sun" : "ph ph-moon";
            };
        }
        document.getElementById("menuToggle")?.addEventListener("click", () => {
            alert("Menu");
        });
        document.getElementById("editProfile")?.addEventListener("click", () => {
            alert("Edit Profile");
        });
    </script>
</body>
</html>
