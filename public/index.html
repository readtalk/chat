<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<title>READTalk Messenger</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="stylesheet" href="css/normalize.css" />
		<link rel="stylesheet" href="css/skeleton.css" />
		<link rel="stylesheet" href="global.css" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />

		<link rel="icon" type="image/ico" href="favicon.ico" />
		<script src="/dist/index.js" type="module"></script>

		<style>
			/* ============================================================
			   MOBILE: CHAT FULL + TOMBOL 3 TITIK DI KANAN
			   ============================================================ */
			@media (max-width: 550px) {
				/* Tombol 3 titik (kanan atas) */
				.menu-dots {
					display: flex !important;
					position: fixed;
					top: 12px;
					right: 12px;
					z-index: 1001;
					font-size: 24px;
					background: none;
					border: none;
					cursor: pointer;
					color: inherit;
					padding: 5px;
				}

				/* Sembunyikan sidebar */
				.one-third.column {
					display: none !important;
				}

				/* Chat full */
				.two-thirds.column {
					width: 100% !important;
					margin-left: 0 !important;
					padding: 0 !important;
				}

				.container {
					width: 100% !important;
					padding: 0 !important;
					margin: 0 !important;
				}

				#root {
					padding: 0 10px;
					margin-top: 50px;
				}
			}

			/* ============================================================
			   DESKTOP: tombol mobile sembunyi, sidebar muncul
			   ============================================================ */
			@media (min-width: 551px) {
				.menu-dots {
					display: none !important;
				}

				.one-third.column {
					display: block !important;
					width: 30.6666666667% !important;
					margin-top: 25% !important;
				}

				.two-thirds.column {
					width: 65.3333333333% !important;
				}
			}
		</style>
	</head>

	<body>
		<!-- ===== MOBILE: Tombol 3 titik (kanan) ===== -->
		<button class="menu-dots" onclick="toggleMenu()">
			<i class="ph ph-dots-three-vertical"></i>
		</button>

		<!-- ===== MAIN LAYOUT ===== -->
		<div class="container" style="width:95%; height:100%">
			<div class="row" style="height:100%">

				<!-- ===== SIDEBAR (Desktop) ===== -->
				<div class="one-third column" style="margin-top:25%">
					<h4><b>READT</b>alk Messenger</h4>
					<p>by SOEPARNO Technology</p>
					<button id="themeToggle" class="button" style="margin-top:20px">
						🌙 Dark
					</button>
				</div>

				<!-- ===== CHAT AREA ===== -->
				<div class="two-thirds column" id="root"></div>

			</div>
		</div>

		<script>
			// ===== TOMBOL 3 TITIK =====
			function toggleMenu() {
				alert('Menu options: Settings, Profile, Theme, Logout');
			}

			// ===== THEME TOGGLE =====
			const root = document.documentElement;
			const savedTheme = localStorage.getItem("theme") || "light";
			root.dataset.theme = savedTheme;

			const btn = document.getElementById("themeToggle");
			if (btn) {
				btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";
				btn.onclick = () => {
					const next = root.dataset.theme === "dark" ? "light" : "dark";
					root.dataset.theme = next;
					localStorage.setItem("theme", next);
					btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
				};
			}
		</script>
	</body>
</html>
