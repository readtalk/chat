<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <title>READTalk Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <script src="/dist/index.js" type="module"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #fff; color: #333; transition: 0.3s; }
        [data-theme="dark"] body { background: #1a1a1a; color: #e0e0e0; }

        .app-header {
            position: fixed; top: 0; left: 0; right: 0; height: 48px;
            background: #f0f0f0; border-bottom: 1px solid #e0e0e0;
            display: flex; align-items: center; padding: 0 16px; z-index: 100;
        }
        [data-theme="dark"] .app-header { background: #333; border-bottom-color: #404040; }
        .header-title { flex: 1; font-weight: 600; font-size: 16px; }
        .menu-button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; color: inherit; }

        .main-container {
            position: fixed; top: 48px; bottom: 48px; left: 0; right: 0;
            display: flex;
        }
        .roster {
            width: 30%; background: #f8f9fa; border-right: 1px solid #e0e0e0;
            overflow-y: auto; padding: 12px;
        }
        [data-theme="dark"] .roster { background: #252525; border-right-color: #404040; }
        .roster-header { font-size: 12px; text-transform: uppercase; color: #666; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e0e0e0; }
        .roster-item { display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .roster-item:hover { background: #e3e3e3; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; }
        .status-online { background: #4caf50; }
        .status-offline { background: #9e9e9e; }
        .roster-name { flex: 1; font-weight: 500; font-size: 14px; }

        .chatlog {
            width: 70%; overflow-y: auto; padding: 16px; background: #fff;
        }
        [data-theme="dark"] .chatlog { background: #1a1a1a; }
        .chat-message { margin-bottom: 12px; }
        .chat-message .username { font-weight: 600; margin-right: 8px; }
        .chat-message .timestamp { font-size: 11px; color: #666; margin-left: 8px; }
        .chat-message .message-content { margin-top: 4px; padding-left: 8px; border-left: 2px solid #e0e0e0; }

        .input-container {
            position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
            background: #fff; border-top: 1px solid #e0e0e0;
            display: flex; align-items: center; padding: 0 16px; gap: 12px;
        }
        [data-theme="dark"] .input-container { background: #1a1a1a; border-top-color: #404040; }
        .chat-input { flex: 1; height: 36px; border: 1px solid #e0e0e0; border-radius: 18px; padding: 0 16px; background: #f5f5f5; outline: none; }
        .chat-input:focus { border-color: #0066cc; }
        .send-button { background: none; border: none; font-size: 20px; cursor: pointer; color: #0066cc; padding: 8px; }
        .send-button:hover { background: #e3e3e3; border-radius: 50%; }

        @media (max-width: 600px) {
            .main-container { flex-direction: column; }
            .roster { width: 100%; height: 100%; display: block; }
            .chatlog { width: 100%; height: 100%; display: none; }
            .input-container { display: none; }
            body.chat-active .roster { display: none; }
            body.chat-active .chatlog { display: block; }
            body.chat-active .input-container { display: flex; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f5; }
        ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("theme") || "light";
        root.dataset.theme = savedTheme;
    </script>
</body>
</html>
