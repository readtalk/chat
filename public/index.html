<!doctype html>
<html lang="en" data-theme="light">
<head>
	<meta charset="utf-8" />
	<title>READTalk</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="global.css" />
	<link rel="icon" type="image/ico" href="favicon.ico" />
	<script src="/dist/index.js" type="module"></script>
	<style>
		/* ===== LAYOUT DASAR (tanpa normalize + skeleton) ===== */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body, html {
			height: 100%;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background-color: #ffffff;
			color: #000000;
			transition: background-color 0.3s, color 0.3s;
		}

		[data-theme="dark"] body {
			background-color: #1a1a1a;
			color: #e0e0e0;
		}

		.container {
			width: 95%;
			height: 100%;
			margin: 0 auto;
			padding: 0;
		}

		.row {
			display: flex;
			height: 100%;
			gap: 0;
		}

		.one-third {
			flex: 0 0 30%;
			max-width: 30%;
			padding: 20px;
			margin-top: 5%;
			border-right: 1px solid #e0e0d8;
			background: #f5f5f0;
			transition: background 0.3s, border-color 0.3s;
		}

		[data-theme="dark"] .one-third {
			background: #2a2a2a;
			border-right-color: #3a3a3a;
		}

		.two-thirds {
			flex: 0 0 70%;
			max-width: 70%;
			padding: 0;
			background: #ffffff;
			transition: background 0.3s;
		}

		[data-theme="dark"] .two-thirds {
			background: #1a1a1a;
		}

		#root {
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			overflow-y: auto;
			padding: 10px;
		}

		.button {
			display: inline-block;
			padding: 8px 20px;
			font-size: 12px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.1rem;
			border: 1px solid #bbb;
			border-radius: 4px;
			cursor: pointer;
			background: transparent;
			color: #555;
			transition: all 0.2s;
		}

		.button:hover {
			color: #333;
			border-color: #888;
		}

		[data-theme="dark"] .button {
			color: #ccc;
			border-color: #555;
		}

		[data-theme="dark"] .button:hover {
			color: #fff;
			border-color: #888;
		}

		/* ===== RESPONSIVE ===== */
		@media (max-width: 550px) {
			.row {
				flex-direction: column;
			}

			.one-third {
				flex: 0 0 100%;
				max-width: 100%;
				margin-top: 0;
				border-right: none;
				border-bottom: 1px solid #e0e0d8;
				padding: 16px;
				text-align: center;
			}

			.two-thirds {
				flex: 0 0 100%;
				max-width: 100%;
			}

			#root {
				padding: 10px;
			}
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="row">
			<div class="one-third">
				<h4><b>READT</b>alk Messenger</h4>
				<button id="themeToggle" class="button" style="margin-top:5px">
					🌙 DARK
				</button>
			</div>
			<div class="two-thirds" id="root"></div>
		</div>
	</div>

	<script>
		const root = document.documentElement
		const savedTheme = localStorage.getItem("theme") || "light"
		root.dataset.theme = savedTheme

		const btn = document.getElementById("themeToggle")
		if (btn) {
			btn.textContent = savedTheme === "dark" ? "☀️ LIGHT" : "🌙 DARK"
			btn.onclick = () => {
				const next = root.dataset.theme === "dark" ? "light" : "dark"
				root.dataset.theme = next
				localStorage.setItem("theme", next)
				btn.textContent = next === "dark" ? "☀️ LIGHT" : "🌙 DARK"
			}
		}
	</script>
</body>
</html>
