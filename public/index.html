<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>READTalk Messenger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 1. Normalize.css: konsistensi browser -->
  <link rel="stylesheet" href="css/normalize.css" />

  <!-- 2. global.css: gaya kustom (menggantikan skeleton) -->
  <link rel="stylesheet" href="global.css" />

  <link rel="icon" type="image/ico" href="favicon.ico" />
  <script src="/dist/index.js" type="module"></script>
</head>
<body>
  <!-- 
    Karena React sekarang mengelola seluruh area chat (app-wrapper),
    kita cukup sediakan container untuk #root dan elemen statis.
  -->
  <div class="app-container">
    <!-- Sidebar Statis (di luar React) -->
    <aside class="app-sidebar-static">
      <h4><b>READT</b>alk Messenger</h4>
      <button id="themeToggle" class="button">🌙 Dark</button>
    </aside>

    <!-- Area React (chat utama) -->
    <main class="app-main-react" id="root"></main>
  </div>

  <script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem("theme") || "light";
    root.dataset.theme = savedTheme;

    const btn = document.getElementById("themeToggle");
    if (btn) {
      btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";
      btn.onclick = () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("theme", next);
        btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
      };
    }
  </script>
</body>
</html>
