<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>READTalk Messenger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PERTAHANKAN: normalize.css untuk konsistensi browser -->
  <link rel="stylesheet" href="css/normalize.css" />
  
  <!-- HAPUS: skeleton.css (sudah diganti global.css) -->
  <!-- <link rel="stylesheet" href="css/skeleton.css" /> -->
  
  <!-- PAKAI: global.css yang baru (isi seperti di atas) -->
  <link rel="stylesheet" href="global.css" />

  <!-- ... icon dan script tetap sama ... -->
  <link rel="icon" type="image/ico" href="favicon.ico" />
  <script src="/dist/index.js" type="module"></script>
</head>
<body>
  <!-- Struktur HTML tetap sama, tapi sekarang lebih rapi -->
  <div class="container" style="width:99%; height:100%">
    <div class="row" style="height:100%">
      <div class="one-third column" style="margin-top:1%">
        <h4><b>READT</b>alk Messenger</h4>
        <p></p>
        <button id="themeToggle" class="button" style="margin-top:5px">
          🌙 Dark
        </button>
      </div>
      <div class="two-thirds column" id="root"></div>
    </div>
  </div>

  <!-- Script tema tetap sama (sudah bagus) -->
  <script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem("theme") || "light";
    root.dataset.theme = savedTheme;
    const btn = document.getElementById("themeToggle");
    if (btn) {
      btn.textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";
      btn.onclick = () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("theme", next);
        btn.textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
      };
    }
  </script>
</body>
</html>
